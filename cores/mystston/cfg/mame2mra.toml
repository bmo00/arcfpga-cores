[global]
author=["bmo00"]

[parse]
sourcefile=[ "mystston.cpp" ]
mustbe.machines=["mystston", "myststono", "myststonoi"]
skip.Bootlegs=true
# Marca de autoria (bmo00) al final del nombre publicado.
rename = [
    { setname="mystston",   name="Mysterious Stones: Dr. John's Adventure (bmo00)" },
    { setname="myststono",  name="Mysterious Stones: Dr. Kick in Adventure (bmo00)" },
    { setname="myststonoi", name="Mysterious Stones: Dr. Kick in Adventure (Itisa PCB) (bmo00)" },
]

[buttons]
names=[
    { machine="mystston", names="Fire,Kick" },
]

[dipsw]
delete=[{names=["Unused"]}]

[ROM]
regions=[
    { name="maincpu" },
    { name="fgtiles_sprites", start="JTFRAME_BA1_START" },
    { name="bgtiles", start="JTFRAME_BA2_START" },
    { name="proms", start="JTFRAME_PROM_START" },
]
order=["maincpu","fgtiles_sprites","bgtiles","proms"]

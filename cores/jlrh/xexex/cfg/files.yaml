      - NOMAIN
    get:
      - jtframe_m68k.yaml
  - from: cpu
    get:
      - jtframe_z80.yaml
  - from: sdram
    get:
      - jtframe_dwnld.v
  - from: ram
    get:
      - jtframe_dual_nvram16.v
  - from: ram
    get:
      - jtframe_obj_buffer.v
      - jtframe_dual_ram.v
      - jtframe_dual_ram16.v
      - jtframe_rpwp_ram.v
      - jtframe_ram16.v
  - from: cpu
    get:
      - jtframe_68kdtack_cen.v
jt51: null
jteeprom:
  - get:
      - jt5911.sv

      - '*.v'
      - '*.sv'
      - xexex_clk48_96.sdc
jtframe:
  - get:
      - jtframe_edge.v
      - jtframe_counter.v
  - from: video
    get:
      - jtframe_vtimer.v
      - jtframe_obj.yaml
      - jtframe_linebuf.v
      - jtframe_linebuf_gate.v
  - from: video/layouts
    get:
      - jtframe_8x8x4_packed_msb.v
  - from: cpu

[global]
author=["arcfpga"]

[parse]
sourcefile=[ "gaelco.cpp" ]
mustbe.machines=["squash"]

[ROM]
# gfx byte-lanes verified byte-identical against the hand-built .mra (c12/c11/c10/c09 swap).
regions=[
    { name="maincpu", width=16, reverse=true },
    { name="gfx", width=32, no_offset=true, start="JTFRAME_BA1_START", sequence=[1,0,3,2] },
    { name="plds", skip=true },
]
order=["maincpu","gfx","oki"]
